name: Run Tests

on: [push]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get install -y libusb-1.0-0-dev libudev-dev

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
          check-latest: true

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run tests
        run: uv run --with pytest,EasyMCP2221 pytest
